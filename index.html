<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Campamentazo 2026 🏕️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4ecdc; --surface:#fffaf1; --surface-2:#f0e5cf; --ink:#2a2017; --muted:#7b6a57; --line:#e2d3b8;
  --primary:#2f4d37; --primary-ink:#fff8ea; --accent:#e0701f; --accent-ink:#fff8ea; --accent-soft:#fbe3c8;
  --good:#4f7a3a; --shadow:0 12px 30px -14px rgba(60,40,20,.35); --radius:20px;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111812; --surface:#1a241c; --surface-2:#223026; --ink:#f2e8d3; --muted:#b4a78f; --line:#2e3d31;
    --primary:#9cc785; --primary-ink:#10190f; --accent:#f08a3c; --accent-ink:#1d1208; --accent-soft:#3a2a1c;
    --good:#9cc785; --shadow:0 12px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#111812; --surface:#1a241c; --surface-2:#223026; --ink:#f2e8d3; --muted:#b4a78f; --line:#2e3d31;
  --primary:#9cc785; --primary-ink:#10190f; --accent:#f08a3c; --accent-ink:#1d1208; --accent-soft:#3a2a1c;
  --good:#9cc785; --shadow:0 12px 30px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 18px}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:8px;height:54px}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.05rem;margin-right:auto;white-space:nowrap}
.nav a.pill{padding:8px 13px;border-radius:99px;text-decoration:none;font-size:.88rem;font-weight:500;color:var(--ink);background:var(--surface-2)}
.icon-btn{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:99px;font-size:1rem}

/* BANNER */
.banner{display:none;padding:9px 16px;text-align:center;font-size:.85rem;font-weight:500}
.banner.show{display:block}
.banner.shared{background:color-mix(in srgb,var(--good) 18%,var(--bg));color:var(--ink)}
.banner.local{background:var(--accent-soft);color:var(--ink)}
.banner.ro{background:#f6d6d0;color:#5b1d12}
:root[data-theme="dark"] .banner.ro{background:#4a2420;color:#ffd9d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.ro{background:#4a2420;color:#ffd9d2}}
body.ro .needs-write{opacity:.45;pointer-events:none}

/* HERO */
.hero{position:relative;overflow:hidden;color:#f7ecd6;text-align:center;padding:46px 0 0;
  background:radial-gradient(90% 55% at 50% 100%,rgba(224,112,31,.55) 0%,rgba(224,112,31,0) 70%),linear-gradient(180deg,#0d1812 0%,#18291f 55%,#233a2b 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.7;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 38% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 62% 24%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 34%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 24% 8%,#fff 50%,transparent 51%)}
.hero .wrap{position:relative;z-index:2}
.kicker{display:inline-block;padding:6px 14px;border-radius:99px;background:rgba(255,248,234,.12);border:1px solid rgba(255,248,234,.22);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.hero h1{font-size:clamp(2.3rem,9vw,4.4rem);font-weight:800;margin:18px 0 12px;text-wrap:balance}
.hero .lead{max-width:560px;margin:0 auto;font-size:1.05rem;color:#e9dcc2}
.stats{display:flex;justify-content:center;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
.stat{min-width:92px;padding:10px 14px;border-radius:16px;background:rgba(255,248,234,.1);border:1px solid rgba(255,248,234,.18)}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem}
.stat span{font-size:.78rem;color:#e9dcc2}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:99px;border:0;font-weight:700;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,background .18s}
.btn:active{transform:scale(.97)}
.btn-fire{background:linear-gradient(135deg,#f2a03d,#e0701f);color:#2a1503;box-shadow:0 10px 24px -10px rgba(224,112,31,.9)}
